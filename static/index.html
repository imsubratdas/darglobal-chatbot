<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DarGlobal and Wasalt Assistant</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
      }
      #app {
        max-width: 720px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      h1 {
        font-size: 18px;
        padding: 14px 16px;
        margin: 0;
        background: #1f3a5f;
        color: #fff;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }
      .msg {
        margin: 8px 0;
        padding: 10px 14px;
        border-radius: 10px;
        max-width: 85%;
        white-space: pre-wrap;
      }
      .user {
        background: #1f3a5f;
        color: #fff;
        margin-left: auto;
      }
      .bot {
        background: #fff;
        border: 1px solid #dde2e7;
      }
      .src {
        font-size: 12px;
        color: #667;
        margin-top: 6px;
        word-break: break-all;
      }
      #bar {
        display: flex;
        gap: 8px;
        padding: 12px;
        background: #fff;
        border-top: 1px solid #dde2e7;
      }
      #q {
        flex: 1;
        padding: 10px;
        font-size: 15px;
      }
      button {
        padding: 10px 18px;
        font-size: 15px;
        background: #1f3a5f;
        color: #fff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>DarGlobal and Wasalt Assistant</h1>
      <div id="log"></div>
      <div id="bar">
        <input
          id="q"
          placeholder="Ask about DarGlobal or Wasalt..."
          autofocus
        />
        <button id="send">Send</button>
      </div>
    </div>
    <script>
      const log = document.getElementById("log");
      const q = document.getElementById("q");
      let history = [];
      function add(text, cls, sources) {
        const d = document.createElement("div");
        d.className = "msg " + cls;
        d.textContent = text;
        if (sources && sources.length) {
          const s = document.createElement("div");
          s.className = "src";
          s.textContent = "Sources: " + sources.join(", ");
          d.appendChild(s);
        }
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
        return d;
      }
      async function send() {
        const text = q.value.trim();
        if (!text) return;
        q.value = "";
        add(text, "user");
        const wait = add("Thinking...", "bot");
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, history: history }),
          });
          const data = await res.json();
          wait.remove();
          if (!res.ok) {
            add("Error: " + (data.detail || res.status), "bot");
            return;
          }
          add(data.answer, "bot", data.sources);
          history.push(
            { role: "user", content: text },
            { role: "assistant", content: data.answer },
          );
        } catch (e) {
          wait.remove();
          add("Network error. Please try again.", "bot");
        }
      }
      document.getElementById("send").onclick = send;
      q.addEventListener("keydown", (e) => {
        if (e.key === "Enter") send();
      });
    </script>
  </body>
</html>
